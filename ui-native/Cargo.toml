[package]
name = "ragasukma-native"
version = "0.1.0"
edition = "2021"

[dependencies]
# Windowing & Graphics
winit = "0.29"
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
gltf = "1.4"
pollster = "0.3"

# Math & Helpers
glam = { version = "0.25", features = ["bytemuck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
