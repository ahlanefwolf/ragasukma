<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Base Squircle (Theme Canvas #EFF7F6) -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="#EFF7F6"/>

  <!-- Headset Headband Arc (Enlarged Arc centered at 256, Radius 170) -->
  <path d="M 86 250 A 170 170 0 0 1 426 250" fill="none" stroke="#232D36" stroke-width="28" stroke-linecap="round"/>

  <!-- Earcups (Theme Cyan #7BDFF2, Scaled Up) -->
  <rect x="56" y="192" width="60" height="116" rx="30" fill="#7BDFF2"/>
  <rect x="396" y="192" width="60" height="116" rx="30" fill="#7BDFF2"/>

  <!-- Boom Microphone (Curving to Center) -->
  <path d="M 86 280 C 86 375, 145 395, 204 375" fill="none" stroke="#232D36" stroke-width="14" stroke-linecap="round"/>
  <rect x="208" y="362" width="28" height="22" rx="11" fill="#F2B5D4"/>

  <!-- Friendly Smiling Eyes (⌒ ⌒, Bold & Enlarged) -->
