<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Gradasi Rambut Blaugrana (Deep Navy Blau -> Midnight) -->
    <linearGradient id="hairMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#244b7a"/>
      <stop offset="50%" stop-color="#142c4c"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>

    <!-- Gradasi Highlight Poni / Twintail Grana -->
    <linearGradient id="hairGrana" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e01e5a"/>
      <stop offset="60%" stop-color="#a50044"/>
      <stop offset="100%" stop-color="#5e0024"/>
    </linearGradient>

    <!-- Gradasi Pita / Aksesoris Emas Barca -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="40%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Kulit Anime Halus -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff4ef"/>
      <stop offset="100%" stop-color="#fedfd5"/>
    </linearGradient>

    <!-- Mata Sapphire Blau Indah -->
    <radialGradient id="eyeSapphire" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="25%" stop-color="#4fc3f7"/>
      <stop offset="60%" stop-color="#0277bd"/>
      <stop offset="88%" stop-color="#012d4a"/>
      <stop offset="100%" stop-color="#00101c"/>
    </radialGradient>

    <!-- Blush Pipi Manis -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4081" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <!-- 1. Rambut Belakang & Twintails Cantik -->
    <path d="M 90 120 C 40 140 25 210 45 270 C 65 250 80 200 95 160 Z" fill="url(#hairGrana)"/>
    <path d="M 230 120 C 280 140 295 210 275 270 C 255 250 240 200 225 160 Z" fill="url(#hairGrana)"/>
    <!-- Rambut Dasar Belakang -->
    <ellipse cx="160" cy="155" rx="85" ry="95" fill="url(#hairMain)"/>

    <!-- Pita Kuncir Kiri & Kanan (Emas Barca) -->
    <!-- Kiri -->
    <g transform="translate(85, 128)">
      <polygon points="0,0 -20,-12 -18,12" fill="url(#goldRibbon)"/>
      <polygon points="0,0 12,-16 -4,-18" fill="url(#goldRibbon)"/>
      <circle cx="0" cy="0" r="5" fill="#a50044"/>
    </g>
    <!-- Kanan -->
    <g transform="translate(235, 128)">
      <polygon points="0,0 20,-12 18,12" fill="url(#goldRibbon)"/>
      <polygon points="0,0 -12,-16 4,-18" fill="url(#goldRibbon)"/>
      <circle cx="0" cy="0" r="5" fill="#a50044"/>
    </g>

    <!-- 2. Telinga Lucu -->
    <ellipse cx="88" cy="170" rx="9" ry="14" fill="url(#skin)"/>
    <ellipse cx="232" cy="170" rx="9" ry="14" fill="url(#skin)"/>
    <ellipse cx="88" cy="170" rx="5" ry="8" fill="#f8bbd0" opacity="0.6"/>
    <ellipse cx="232" cy="170" rx="5" ry="8" fill="#f8bbd0" opacity="0.6"/>

    <!-- 3. Wajah Anime Chibi Imut & Mulus -->
    <path d="M 92 145 C 90 205 118 248 160 248 C 202 248 230 205 228 145 C 228 110 92 110 92 145 Z" fill="url(#skin)"/>

    <!-- Pipi Merona / Blush -->
    <ellipse cx="118" cy="192" rx="15" ry="8" fill="url(#blush)"/>
    <ellipse cx="202" cy="192" rx="15" ry="8" fill="url(#blush)"/>
    <line x1="112" y1="191" x2="120" y2="187" stroke="#e01e5a" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <line x1="116" y1="196" x2="124" y2="192" stroke="#e01e5a" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <line x1="196" y1="191" x2="204" y2="187" stroke="#e01e5a" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <line x1="200" y1="196" x2="208" y2="192" stroke="#e01e5a" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 4. Mata Anime Besar Berbinar (Idle: Ramah & Manis) -->
    <!-- Mata Kiri -->
    <g>
      <ellipse cx="126" cy="168" rx="15" ry="20" fill="url(#eyeSapphire)"/>
      <ellipse cx="126" cy="164" rx="8" ry="11" fill="#021424"/>
      <!-- Pantulan Cahaya Mata (Sparkles) -->
      <circle cx="120" cy="158" r="6" fill="#ffffff"/>
      <circle cx="132" cy="177" r="3" fill="#ffffff"/>
      <circle cx="122" cy="175" r="2" fill="#ffd54f"/>
      <!-- Bulu Mata Lentik Atas & Bawah -->
      <path d="M 106 156 Q 126 138 146 156" fill="none" stroke="#0a1626" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 143 151 L 149 146" stroke="#0a1626" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 112 186 Q 126 193 138 188" fill="none" stroke="#142c4c" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Mata Kanan -->
    <g>
      <ellipse cx="194" cy="168" rx="15" ry="20" fill="url(#eyeSapphire)"/>
      <ellipse cx="194" cy="164" rx="8" ry="11" fill="#021424"/>
      <!-- Pantulan Cahaya Mata -->
      <circle cx="188" cy="158" r="6" fill="#ffffff"/>
      <circle cx="200" cy="177" r="3" fill="#ffffff"/>
      <circle cx="190" cy="175" r="2" fill="#ffd54f"/>
      <!-- Bulu Mata Lentik Atas & Bawah -->
      <path d="M 174 156 Q 194 138 214 156" fill="none" stroke="#0a1626" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 211 151 L 217 146" stroke="#0a1626" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 182 188 Q 194 193 208 186" fill="none" stroke="#142c4c" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Alis Lembut -->
    <path d="M 114 140 Q 126 132 138 139" fill="none" stroke="#185a9d" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 182 139 Q 194 132 206 140" fill="none" stroke="#185a9d" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Hidung Mungil -->
    <circle cx="160" cy="184" r="1.4" fill="#e01e5a"/>

    <!-- Senyum Manis Chibi (Idle) -->
    <path d="M 152 203 Q 160 210 168 203" fill="none" stroke="#a50044" stroke-width="2.8" stroke-linecap="round"/>

    <!-- 5. Rambut Depan / Poni Anime Cantik Berlayer -->
    <!-- Rambut Samping Kiri & Kanan (Framing Face) -->
    <path d="M 94 125 C 85 160 84 200 96 230 C 102 230 106 185 106 145 Z" fill="url(#hairMain)"/>
    <path d="M 226 125 C 235 160 236 200 224 230 C 218 230 214 185 214 145 Z" fill="url(#hairMain)"/>
    
    <!-- Poni Atas Kubah -->
    <path d="M 85 125 C 85 55 235 55 235 125 C 215 110 105 110 85 125 Z" fill="url(#hairMain)"/>
    
    <!-- Helai Poni Tengah & Samping (Blau + Aksen Grana) -->
    <path d="M 100 112 Q 112 152 118 158 Q 124 135 128 112 Z" fill="url(#hairMain)"/>
    <path d="M 124 112 Q 138 158 144 163 Q 148 135 152 112 Z" fill="url(#hairGrana)"/>
    <path d="M 148 112 Q 156 160 162 165 Q 168 135 174 112 Z" fill="url(#hairMain)"/>
    <path d="M 170 112 Q 182 158 190 162 Q 196 135 200 112 Z" fill="url(#hairGrana)"/>
    <path d="M 194 112 Q 206 150 216 155 Q 218 135 220 112 Z" fill="url(#hairMain)"/>

    <!-- Jepit Rambut Bintang Emas Barça di Sisi Kiri -->
    <g transform="translate(108, 105)">
      <polygon points="0,-9 3,-3 9,-3 4,2 6,8 0,4 -6,8 -4,2 -9,-3 -3,-3" fill="url(#goldRibbon)"/>
    </g>
  </g>
</svg>
