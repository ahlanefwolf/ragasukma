[package]
name = "ragasukma"
version = "0.2.0"
edition = "2024"
description = "AI Voice Assistant with 3D/2D Native WGPU Overlay"
authors = ["Ahlan Saputra <hlnsptr@gmail.com>"]

[package.metadata.packager]
product-name = "Ragasukma"
identifier = "com.ragasukma.assistant"
category = "Utility"
authors = ["Ahlan Saputra"]
description = "AI Voice Assistant & 3D/2D Avatar Assistant"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.ico"]
resources = ["assets"]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"



[dependencies]
# Async Runtime & Web Server Engine (Axum + Tokio)
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-stream = "0.3"

# Audio, STT, LLM, TTS
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-isomp4", "symphonia-vorbis", "symphonia-aac", "symphonia-flac"] }
form_urlencoded = "1.2"
regex = "1.10"
sha2 = "0.10"
base64 = "0.22"
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "copy-dylibs"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Windowing, 3D Graphics & Native Overlay Engine
winit = "0.29"
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
gltf = "1.4"
pollster = "0.3"
glam = { version = "0.25", features = ["bytemuck"] }
rust-embed = { version = "8.5", features = ["include-exclude"] }

xcap = "0.0.14"
mimalloc = { version = "0.1", default-features = false }

# OS Accessibility Tree Scanner (Cross-Platform Native)
[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", features = ["zbus"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "UI_UIAutomation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Media_Ocr",
    "Win32_System_Console",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections"
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
