[package]
name = "ragasukma"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
rubato = "0.16"
rodio = "0.19"
form_urlencoded = "1.2"
regex = "1.10"
base64 = "0.22"
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
