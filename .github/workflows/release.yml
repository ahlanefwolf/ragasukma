name: "Release App (Native Engine CI/CD)"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ------------------------------------------------------------------
          # Linux (x86_64 AppImage) - Completed
          # ------------------------------------------------------------------
          # - platform: "ubuntu-24.04"
          #   target: "x86_64-unknown-linux-gnu"
          #   package_format: "appimage"
          #   os_name: "linux"

          # ------------------------------------------------------------------
          # Windows (x86_64 NSIS Installer / .exe)
          # ------------------------------------------------------------------
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            package_format: "nsis"
            os_name: "windows"

          # ------------------------------------------------------------------
          # macOS (Apple Silicon / aarch64 DMG) - Temporarily disabled
          # ------------------------------------------------------------------
          # - platform: "macos-latest"
          #   target: "aarch64-apple-darwin"
          #   package_format: "dmg"
          #   os_name: "macos"

    steps:
      # ======================================================================
      # CHECKOUT
      # ======================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================================
      # LINUX DEPENDENCIES
      # ======================================================================
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 \
            g++-14 \
            libstdc++-14-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            squashfs-tools
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 100
          sudo apt-get install -y libfuse2t64 2>/dev/null || sudo apt-get install -y libfuse2 || true

      # ======================================================================
      # NODE.JS / WEB DASHBOARD
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web Dashboard Frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # ======================================================================
      # RUST TOOLCHAIN & CACHE
      # ======================================================================
      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ======================================================================
      # CARGO-PACKAGER
      # ======================================================================
      - name: Install cargo-packager
        run: |
          cargo install cargo-packager --locked

      # ======================================================================
      # BUILD
      # ======================================================================
      - name: Build Release Binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CC=gcc-14
            export CXX=g++-14
          fi
          cargo build \
            --release \
            --target ${{ matrix.target }}

      # ======================================================================
      # PREPARE WINDOWS DEPENDENCIES
      # ======================================================================
      - name: Prepare Windows DLLs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist_dlls
          echo "=== Copying runtime DLLs to dist_dlls ==="
          find target -name "*.dll" -exec cp -v {} dist_dlls/ \; || true
          if [ ! -f "dist_dlls/DirectML.dll" ]; then
            echo "DirectML.dll not found in target, fetching Microsoft DirectML redistributable..."
            curl -sLo directml.zip "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.2"
            unzip -q directml.zip -d directml_nuget
            cp -v directml_nuget/bin/x64-win/DirectML.dll dist_dlls/
          fi
          echo "=== Bundled DLLs for Installer ==="
          ls -lh dist_dlls/

      # ======================================================================
      # PACKAGE
      # ======================================================================
      - name: Package Native Installer
        shell: bash
        run: |
          cargo packager \
            --release \
            --target ${{ matrix.target }} \
            --formats ${{ matrix.package_format }}

      # ======================================================================
      # LIST OUTPUT (DEBUG)
      # ======================================================================
      - name: List Linux / macOS Output
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "=== Packager output ==="
          find "target/${{ matrix.target }}/release" \
            -type f \
            \( \
              -name "*.AppImage" \
              -o -name "*.deb" \
              -o -name "*.tar.gz" \
              -o -name "*.tar.zst" \
              -o -name "*.dmg" \
              -o -name "*.exe" \
            \) \
            -print

      - name: List Windows Output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Packager output ==="
          Get-ChildItem `
            -Recurse `
            "target\${{ matrix.target }}\release" `
            -Include *.exe, *.msi |
            Select-Object FullName, Length

      # ======================================================================
      # VERIFY RELEASE ARTIFACTS EXIST
      # ======================================================================
      - name: Verify Linux Artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(find "target/${{ matrix.target }}/release" -type f -name "*.AppImage")

          if [ -z "$files" ]; then
            echo "ERROR: Linux AppImage package was not generated."
            exit 1
          fi

          echo "Linux artifacts found:"
          echo "$files"

      - name: Verify Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            -Recurse `
            "target\${{ matrix.target }}\release" `
            -Filter *.exe

          if ($files.Count -eq 0) {
            Write-Error "ERROR: Windows EXE was not generated."
            exit 1
          }

          Write-Host "Windows EXE found:"
          $files | Select-Object FullName, Length

      - name: Verify macOS Artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          files=$(find "target/${{ matrix.target }}/release" \
            -type f \
            -name "*.dmg")

          if [ -z "$files" ]; then
            echo "ERROR: DMG was not generated."
            exit 1
          fi

          echo "DMG found:"
          echo "$files"

      # ======================================================================
      # SHA-256 CHECKSUMS
      # ======================================================================
      - name: Generate SHA-256 Checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          find . \
            -type f \
            -name "*.AppImage" \
            -print0 |
            xargs -0 sha256sum > SHA256SUMS-linux.txt

          cat SHA256SUMS-linux.txt

      - name: Generate SHA-256 Checksums (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          : > SHA256SUMS-macos.txt

          find . \
            -type f \
            -name "*.dmg" \
            -print0 |
            while IFS= read -r -d '' file; do
              shasum -a 256 "$file" >> SHA256SUMS-macos.txt
            done

          cat SHA256SUMS-macos.txt

      - name: Generate SHA-256 Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = "target\${{ matrix.target }}\release\SHA256SUMS-windows.txt"
          Remove-Item $output -ErrorAction SilentlyContinue

          Get-ChildItem `
            -Recurse `
            "target\${{ matrix.target }}\release" `
            -Filter *.exe |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              "$hash  $($_.Name)" | Out-File `
                -FilePath $output `
                -Append `
                -Encoding utf8
            }

          Get-Content $output

      # ======================================================================
      # WINDOWS SIGNATURE CHECK
      # ======================================================================
      - name: Check Windows Digital Signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            -Recurse `
            "target\${{ matrix.target }}\release" `
            -Filter *.exe

          foreach ($file in $files) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host "Checking: $($file.FullName)"
            Write-Host "========================================"

            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "Status    : $($signature.Status)"
            Write-Host "Signer    : $($signature.SignerCertificate.Subject)"
            Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)"
          }

      # ======================================================================
      # PREPARE RELEASE FILES
      # ======================================================================
      - name: Prepare Release Directory
        shell: bash
        run: |
          mkdir -p release

      - name: Copy Linux Release Files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find "target/${{ matrix.target }}/release" \
            -type f \
            -name "*.AppImage" \
            -exec cp {} release/ \;

          cp "target/${{ matrix.target }}/release/SHA256SUMS-linux.txt" \
            release/

          ls -lah release/

      - name: Copy Windows Release Files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem `
            -Recurse `
            "target\${{ matrix.target }}\release" `
            -Filter *.exe |
            ForEach-Object {
              Copy-Item $_.FullName release\
            }

          Copy-Item `
            "target\${{ matrix.target }}\release\SHA256SUMS-windows.txt" `
            release\

          Get-ChildItem release

      - name: Copy macOS Release Files
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find "target/${{ matrix.target }}/release" \
            -type f \
            -name "*.dmg" \
            -exec cp {} release/ \;

          cp "target/${{ matrix.target }}/release/SHA256SUMS-macos.txt" \
            release/

          ls -lah release/

      # ======================================================================
      # UPLOAD GITHUB RELEASE
      # ======================================================================
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
