name: "Release App (Native Engine CI/CD)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            package_format: 'appimage'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            package_format: 'nsis'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            package_format: 'dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Linux System Dependencies & Packaging Tools
      # ------------------------------------------------------------------------
      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
                                  curl \
                                  wget \
                                  file \
                                  pkg-config \
                                  libssl-dev \
                                  libasound2-dev \
                                  squashfs-tools \
                                  libfuse2

      # ------------------------------------------------------------------------
      # Build Web Dashboard Assets (Required by rust-embed)
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web Dashboard Frontend
        run: |
          cd web
          npm ci
          npm run build

      # ------------------------------------------------------------------------
      # Rust Toolchain Setup
      # ------------------------------------------------------------------------
      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # ------------------------------------------------------------------------
      # Build Binaries & Native Installers (.AppImage, .dmg, .exe)
      # ------------------------------------------------------------------------
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build Binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package Native Installers
        run: |
          cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.package_format }}

      # Debug: List packager output files
      - name: List packager output (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          find target/${{ matrix.target }}/release -type f \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.exe" \) || true

      - name: List packager output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse target\${{ matrix.target }}\release\ -Include *.exe, *.msi | Select-Object FullName

      # ------------------------------------------------------------------------
      # Upload Release Assets (Overwrites .AppImage, .dmg, .exe)
      # ------------------------------------------------------------------------
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.target }}/release/*.AppImage
            target/${{ matrix.target }}/release/**/*.AppImage
            target/${{ matrix.target }}/release/*.dmg
            target/${{ matrix.target }}/release/**/*.dmg
            target/${{ matrix.target }}/release/*.exe
            target/${{ matrix.target }}/release/**/*.exe
          fail_on_unmatched_files: false
          overwrite: true
