name: "Release App (Native Engine CI/CD)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            bin_name: 'ragasukma'
            archive_ext: 'tar.gz'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            bin_name: 'ragasukma.exe'
            archive_ext: 'zip'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            bin_name: 'ragasukma'
            archive_ext: 'tar.gz'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Linux System Dependencies & Packaging Tools
      # ------------------------------------------------------------------------
      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
                                  curl \
                                  wget \
                                  file \
                                  pkg-config \
                                  libssl-dev \
                                  libasound2-dev \
                                  rpm \
                                  squashfs-tools \
                                  libfuse2

      # ------------------------------------------------------------------------
      # Build Web Dashboard Assets (Required by rust-embed)
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web Dashboard Frontend
        run: |
          cd web
          npm ci
          npm run build

      # ------------------------------------------------------------------------
      # Rust Toolchain Setup
      # ------------------------------------------------------------------------
      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # ------------------------------------------------------------------------
      # Build Binaries & Native Installers (.deb, .AppImage, .rpm, .pacman, .exe NSIS, .dmg)
      # ------------------------------------------------------------------------
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build & Package Native Installers
        run: |
          cargo packager --release --target ${{ matrix.target }}

      # ------------------------------------------------------------------------
      # Upload Release Asset
      # ------------------------------------------------------------------------
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.target }}/release/ragasukma*
            target/${{ matrix.target }}/release/packager/*
