<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions & Palettes -->
  <defs>
    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDEAE1"/>
      <stop offset="60%" stop-color="#F7EFE4"/>
      <stop offset="100%" stop-color="#ECD7C4"/>
    </linearGradient>

    <!-- Hair Tone Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1218"/>
      <stop offset="50%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>

    <!-- Ponytail Gradient -->
    <linearGradient id="ponyGrad" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#222936"/>
      <stop offset="40%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>

    <!-- Eye Iris Gradient (Deep Electro Violet to Wish Gold) -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="50%" stop-color="#3E296A"/>
      <stop offset="100%" stop-color="#E5B85C"/>
    </linearGradient>

    <!-- Headset Band Gradient -->
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1218"/>
      <stop offset="50%" stop-color="#222936"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>

    <!-- Ponytail Tie (Wish Gold Gradient) -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CE7A"/>
      <stop offset="100%" stop-color="#9E8046"/>
    </linearGradient>
  </defs>

  <!-- 1. PONYTAIL -->
  <path d="M 320 180 
           C 390 170, 435 220, 420 300 
           C 410 355, 375 425, 340 460 
           C 350 420, 365 370, 370 330 
           C 375 285, 355 240, 305 210 Z" 
        fill="url(#ponyGrad)"/>

  <path d="M 330 195 
           C 385 190, 415 240, 405 310 
           C 395 370, 360 435, 335 462 
           C 348 425, 360 370, 360 330 
           C 360 280, 340 235, 310 215 Z" 
        fill="#181D26" opacity="0.8"/>

  <path d="M 355 215 C 385 240, 395 285, 385 340" fill="none" stroke="#9E8046" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 2. IKAT RAMBUT KUNCIR KUDA -->
  <ellipse cx="320" cy="190" rx="16" ry="22" transform="rotate(-25 320 190)" fill="url(#ribbonGrad)" stroke="#181D26" stroke-width="3.5"/>
  <ellipse cx="320" cy="190" rx="9" ry="15" transform="rotate(-25 320 190)" fill="#E5B85C"/>
  <path d="M 326 205 C 340 225, 335 245, 328 260 C 324 245, 326 230, 320 212 Z" fill="#E5B85C" stroke="#181D26" stroke-width="2"/>

  <!-- 3. RAMBUT DASAR BELAKANG KEPALA -->
  <path d="M 158 220 
           C 154 158, 200 130, 256 130 
           C 312 130, 354 158, 354 220 
           C 354 265, 344 305, 320 326 
           C 294 340, 218 340, 192 326 
           C 168 305, 158 265, 158 220 Z" 
        fill="url(#hairGrad)"/>

  <!-- 4. KONTUR WAJAH BULAT IMUT -->
  <path d="M 168 225 
           C 168 295, 196 358, 256 358 
           C 316 358, 344 295, 344 225 
           C 344 175, 168 175, 168 225 Z" 
        fill="url(#skinGrad)"/>

  <!-- 5. HEADPHONE HEADBAND -->
  <path d="M 142 245 A 130 138 0 0 1 370 245" fill="none" stroke="url(#headbandGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 195 120 C 235 112, 277 112, 317 120" fill="none" stroke="#E5B85C" stroke-width="5" stroke-linecap="round"/>

  <!-- 6. HELAI RAMBUT DEPAN -->
  <path d="M 166 195 
           C 158 255, 168 312, 186 338 
           C 190 312, 182 262, 188 225 Z" 
        fill="#181D26"/>

  <path d="M 346 195 
           C 354 255, 344 312, 326 338 
           C 322 312, 330 262, 324 225 Z" 
        fill="#181D26"/>

  <!-- Poni Depan Lurus -->
  <path d="M 164 190 
           C 176 242, 214 262, 226 226 
           C 238 262, 274 262, 286 222 
           C 298 258, 336 250, 348 190 
           C 334 145, 178 145, 164 190 Z" 
        fill="url(#hairGrad)"/>

  <!-- Angel Ring Highlight -->
  <path d="M 184 205 Q 205 212, 222 205" fill="none" stroke="#F3CE7A" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M 240 205 Q 256 210, 272 205" fill="none" stroke="#F3CE7A" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M 290 205 Q 310 212, 328 205" fill="none" stroke="#F3CE7A" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>

  <!-- Jepit Rambut Estetis -->
  <rect x="178" y="184" width="22" height="6.5" rx="3" transform="rotate(-15 178 184)" fill="#E5B85C"/>
  <rect x="182" y="194" width="18" height="5.5" rx="2.5" transform="rotate(-15 182 194)" fill="#9E8046"/>

  <!-- 7. MATA THINKING (Melirik ke Kanan-Atas) -->
  <!-- Mata Kiri -->
  <g id="leftEye">
    <path d="M 188 250 C 200 238, 224 238, 234 251" fill="none" stroke="#0F1218" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Iris Bergeser ke Kanan-Atas -->
    <ellipse cx="216" cy="260" rx="15.5" ry="19.5" fill="url(#eyeGrad)"/>
    <ellipse cx="216" cy="260" rx="8" ry="11" fill="#0F1218"/>
    <circle cx="212" cy="254" r="5" fill="#EDEAE1"/>
    <circle cx="221" cy="266" r="2.8" fill="#EDEAE1" opacity="0.85"/>
    <ellipse cx="216" cy="275" rx="7.5" ry="2.8" fill="#F3CE7A" opacity="0.6"/>
    <path d="M 196 278 C 206 284, 218 284, 226 278" fill="none" stroke="#9FA7B8" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Mata Kanan -->
  <g id="rightEye">
    <path d="M 324 250 C 312 238, 288 238, 278 251" fill="none" stroke="#0F1218" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Iris Bergeser ke Kanan-Atas -->
    <ellipse cx="304" cy="260" rx="15.5" ry="19.5" fill="url(#eyeGrad)"/>
    <ellipse cx="304" cy="260" rx="8" ry="11" fill="#0F1218"/>
    <circle cx="300" cy="254" r="5" fill="#EDEAE1"/>
    <circle cx="309" cy="266" r="2.8" fill="#EDEAE1" opacity="0.85"/>
    <ellipse cx="304" cy="275" rx="7.5" ry="2.8" fill="#F3CE7A" opacity="0.6"/>
    <path d="M 316 278 C 306 284, 294 284, 286 278" fill="none" stroke="#9FA7B8" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 8. HIDUNG -->
  <path d="M 254 286 L 258 293 L 253 294" fill="none" stroke="#9E8046" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 9. PIPI MERONA -->
  <ellipse cx="206" cy="296" rx="16" ry="7" fill="#E09F3E" opacity="0.4"/>
  <ellipse cx="306" cy="296" rx="16" ry="7" fill="#E09F3E" opacity="0.4"/>
  <line x1="198" y1="294" x2="206" y2="298" stroke="#E05345" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <line x1="208" y1="294" x2="216" y2="298" stroke="#E05345" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <line x1="296" y1="294" x2="304" y2="298" stroke="#E05345" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <line x1="306" y1="294" x2="314" y2="298" stroke="#E05345" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

  <!-- 10. MULUT THINKING -->
  <path d="M 248 325 Q 256 322, 266 327" fill="none" stroke="#9E8046" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 252 335 Q 256 337, 260 335" fill="none" stroke="#F3CE7A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Partikel Berpikir / Sparkle Shard Keemasan Genshin -->
  <g opacity="0.85">
    <polygon points="348,150 351,157 358,160 351,163 348,170 345,163 338,160 345,157" fill="#E5B85C"/>
    <circle cx="366" cy="172" r="3" fill="#9E8046"/>
    <circle cx="334" cy="142" r="2.2" fill="#F3CE7A"/>
  </g>

  <!-- 11. HEADPHONE EARCUPS -->
  <g id="leftEarPad">
    <rect x="132" y="215" width="30" height="70" rx="15" fill="#181D26" stroke="#9E8046" stroke-width="3.5"/>
    <rect x="142" y="226" width="9" height="48" rx="4.5" fill="#EDEAE1" opacity="0.2"/>
    <rect x="138" y="206" width="16" height="12" rx="3.5" fill="#E5B85C"/>
  </g>

  <g id="rightEarPad">
    <rect x="350" y="215" width="30" height="70" rx="15" fill="#181D26" stroke="#9E8046" stroke-width="3.5"/>
    <rect x="360" y="226" width="9" height="48" rx="4.5" fill="#EDEAE1" opacity="0.2"/>
    <rect x="358" y="206" width="16" height="12" rx="3.5" fill="#E5B85C"/>
  </g>

  <!-- 12. BOOM MICROPHONE (Glow Amber / Warning #E09F3E) -->
  <path d="M 146 274 C 146 342, 188 364, 226 348" fill="none" stroke="#333C4D" stroke-width="6.5" stroke-linecap="round"/>
  <rect x="224" y="340" width="22" height="15" rx="5.5" fill="#181D26" stroke="#9E8046" stroke-width="2.8"/>
  <!-- Glowing LED Mic Thinking -->
  <circle cx="235" cy="347.5" r="4.5" fill="#E09F3E" opacity="0.4"/>
  <circle cx="235" cy="347.5" r="2.8" fill="#E5B85C"/>
</svg>
