<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VRM Pose & Motion Tuner</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="assets/tuner.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/": "./vendor/",
      "three/addons/": "./vendor/three-addons/",
      "@pixiv/three-vrm": "./vendor/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- Loading Screen -->
  <div id="tuner-loader" class="tuner-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Menyiapkan Pose Tuner...</div>
    <div class="loader-subtext">Memuat model 3D VRM & konfigurasi pose</div>
  </div>

  <div id="notification">Notification</div>

  <!-- Top Bar -->
  <div id="topbar">
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg class="icon" viewBox="0 0 24 24"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/></svg>
      <h2>Pose Tuner</h2>
    </div>
    <span class="badge">poses.json</span>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <span class="tb-label">State:</span>
      <select id="state-select">
        <option value="idle">Idle</option>
        <option value="listening">Listening</option>
        <option value="thinking">Thinking</option>
        <option value="speaking">Speaking</option>
      </select>
    </div>

    <div class="tb-group">
      <span class="tb-label">Emotion:</span>
      <select id="emotion-select">
        <option value="neutral">Neutral</option>
        <option value="happy">Happy</option>
        <option value="shy">Shy</option>
        <option value="surprised">Surprised</option>
        <option value="thinking">Thinking</option>
        <option value="sad">Sad</option>
        <option value="excited">Excited</option>
        <option value="confused">Confused</option>
      </select>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-speed">
      <span class="tb-label">Speed:</span>
      <input type="range" class="slider-h" id="speed-slider" min="0.2" max="4.0" step="0.1" value="1.2" />
      <span class="tb-speed-val" id="speed-val">1.2x</span>
    </div>

    <div class="tb-sep"></div>

    <button class="tab-btn active" id="tab-pose-a">Pose A</button>
    <button class="tab-btn" id="tab-pose-b">Pose B</button>

    <div class="tb-sep"></div>

    <button class="btn-sm" id="btn-copy-a-to-b" title="Copy semua nilai Pose A ke Pose B">
      <svg class="icon-sm" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <span>A→B</span>
    </button>
    <button class="btn-sm" id="btn-copy-b-to-a" title="Copy semua nilai Pose B ke Pose A">
      <svg class="icon-sm" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <span>B→A</span>
    </button>
    <button class="btn-sm" id="btn-reverse-a-to-b" title="Mirror kiri-kanan A ke B">
      <svg class="icon-sm" viewBox="0 0 24 24"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
      <span>Mirror A→B</span>
    </button>
    <button class="btn-sm" id="btn-reverse-b-to-a" title="Mirror kiri-kanan B ke A">
      <svg class="icon-sm" viewBox="0 0 24 24"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
      <span>Mirror B→A</span>
    </button>

    <div class="ml-auto"></div>

    <button class="btn-sm" id="btn-preview">
      <svg class="icon-sm" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      <span>Preview</span>
    </button>
    <button class="btn-sm" id="btn-reload">
      <svg class="icon-sm" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
      <span>Reload</span>
    </button>
    <button class="btn-sm danger" id="btn-reset-all">
      <svg class="icon-sm" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
      <span>Reset All</span>
    </button>
    <button class="btn-sm primary" id="btn-save">
      <svg class="icon-sm" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span>Simpan</span>
    </button>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="viewport-container">
      <div id="viewport-hint">
        <span><svg class="icon-sm" style="display:inline-block; vertical-align:-2px; width:12px; height:12px;" viewBox="0 0 24 24"><path d="m3 3 7 18 3-7 7-3L3 3z"/></svg> <b>Klik Kiri:</b> Putar Orbit</span>
        <span><svg class="icon-sm" style="display:inline-block; vertical-align:-2px; width:12px; height:12px;" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg> <b>Klik Kanan / Shift+Drag:</b> Geser Pan</span>
        <span><svg class="icon-sm" style="display:inline-block; vertical-align:-2px; width:12px; height:12px;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg> <b>Scroll:</b> Zoom</span>
      </div>
    </div>

    <div id="bone-panel">
      <div id="bone-cat-bar">
        <!-- Category Tab Buttons generated by JS -->
      </div>
      <div id="bone-grid">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <script type="module" src="assets/tuner.js"></script>
</body>
</html>
